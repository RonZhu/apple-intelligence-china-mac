# Surge for Mac snippet: route Apple Intelligence / Siri AI traffic to one stable US exit.
# Merge the sections below into your own profile. No proxy nodes or subscriptions are included.
# Verified 2026-10 on macOS 27.0.1 with Surge 6.9 (system proxy ON + enhanced mode ON).
#
# !!! Mac only. Do NOT add the skip-proxy line to a profile used by iPhone/iPad:
# !!! iOS ignores PROCESS-NAME, so Siri web search there would fall into "17.0.0.0/8 -> DIRECT" and break.

[General]
# Append to your existing skip-proxy list (do not replace it):
#   searchtoold's sandbox only allows remote port 443, so it cannot use 127.0.0.1:6152/6153.
skip-proxy = <your existing list>, api-siri-prod.apple.com

# Only if you also run Tailscale with `tailscale set --accept-dns=false`:
# always-real-ip = *.ts.net, <device-short-name-1>, <device-short-name-2>

[Proxy Group]
# Replace with your own US proxies / groups.
🧠 Apple Intelligence = select, <US proxy 1>, <US proxy 2>

[Rule]
# Put these BEFORE any broad Apple rule set (many Apple.list rule sets contain IP-CIDR 17.0.0.0/8 -> DIRECT).
# Siri web search daemon (Mac only; ignored on iOS). Works even when it connects by raw IP.
PROCESS-NAME,searchtoold,"🧠 Apple Intelligence"
# Siri / Apple Intelligence
DOMAIN,guzzoni.apple.com,"🧠 Apple Intelligence"
DOMAIN,guzzoni-apple-com.v.aaplimg.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,smoot.apple.com,"🧠 Apple Intelligence"
DOMAIN-KEYWORD,siri,"🧠 Apple Intelligence"
# Private Cloud Compute relays / attestation
DOMAIN,mask-api.fe.apple-dns.net,"🧠 Apple Intelligence"
DOMAIN,mask-api.icloud.com,"🧠 Apple Intelligence"
DOMAIN,mask-t.apple-dns.net,"🧠 Apple Intelligence"
DOMAIN,mask.apple-dns.net,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,mask-h2.icloud.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,mask.icloud.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,apple-relay.apple.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,apple-relay.cloudflare.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,apple-relay.fastly-edge.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,cp4.cloudflare.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,gateway.icloud.com,"🧠 Apple Intelligence"
# Weather / location-backed answers
DOMAIN,weatherkit.apple.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,ls.apple.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,gspe1-ssl.ls.apple.com,"🧠 Apple Intelligence"
# App Store–backed extensions / tokens
DOMAIN,amp-api.apps.apple.com,"🧠 Apple Intelligence"
DOMAIN,sf-api-token-service.itunes.apple.com,"🧠 Apple Intelligence"
DOMAIN-SUFFIX,apps.mzstatic.com,"🧠 Apple Intelligence"

[Host]
# Only if you run Tailscale with accept-dns=false: let MagicDNS resolve tailnet names.
# *.ts.net = server:100.100.100.100
# <device-short-name-1> = server:100.100.100.100
